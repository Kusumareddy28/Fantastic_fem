<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#f5e6f0"/>
  
  <!-- Central flower petals -->
  <g transform="translate(50, 50)">
    <!-- Pink/Red petals -->
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#d97ba0" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#e89fb0" transform="rotate(45)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#d97ba0" transform="rotate(90)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#e89fb0" transform="rotate(135)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#d97ba0" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#e89fb0" transform="rotate(225)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#d97ba0" transform="rotate(270)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#e89fb0" transform="rotate(315)"/>
    
    <!-- Purple accents -->
    <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#b896ca" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#b896ca" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#b896ca" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#b896ca" transform="rotate(292.5)"/>
    
    <!-- Orange accents -->
    <ellipse cx="0" cy="-15" rx="6" ry="10" fill="#f4b894" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-15" rx="6" ry="10" fill="#f4b894" transform="rotate(247.5)"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#d97ba0"/>
    <circle cx="0" cy="0" r="4" fill="#e89fb0"/>
  </g>
</svg>